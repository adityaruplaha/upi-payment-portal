# Test, type-check and build every push and pull request, and on a push to main or a manual run on
# main, deploy to Cloudflare Workers and check that both hostnames answer.
# The deploy needs the repository secret CLOUDFLARE_API_TOKEN, a Cloudflare API token made from the
# "Edit Cloudflare Workers" template; the account ID is in wrangler.jsonc.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer push waits for the running one rather than cancelling it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check
        run: bun run check -- --fail-on-warnings

      - name: Build
        run: bun run build

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The root redirects to the bare domain, and a token that does not exist answers 404.
      # arl.dance has Bot Fight Mode on, which challenges the runner, so there a Cloudflare challenge
      # also passes: it shows the hostname reaches Cloudflare, and the Worker is the same one
      # pay.adityaruplaha.me reaches.
      - name: Check the live hostnames
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sleep 10
          check() {
            host=$1 path=$2 expected=$3
            code=$(curl -s -o /dev/null -D headers.txt -w '%{http_code}' "https://$host$path")
            if [ "$code" = "$expected" ]; then
              echo "$host$path $code"
            elif [ "$host" = pay.arl.dance ] && [ "$code" = 403 ] && grep -qi '^cf-mitigated: *challenge' headers.txt; then
              echo "$host$path $code, a Cloudflare challenge"
            else
              echo "$host$path $code, expected $expected"
              return 1
            fi
          }
          for host in pay.adityaruplaha.me pay.arl.dance; do
            check "$host" "/?v=$GITHUB_RUN_ID" 307
            check "$host" "/no-such-token-$GITHUB_RUN_ID" 404
          done
